<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Bayan, UI/UX and Web Designer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#9B87F5" flood-opacity="0.18"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="28"/></clipPath>
    <path id="spark" d="M0,-10 C1.5,-2 2,-1.5 10,0 C2,1.5 1.5,2 0,10 C-1.5,2 -2,1.5 -10,0 C-2,-1.5 -1.5,-2 0,-10Z"/>
    <g id="tileBody">
      <rect width="110" height="64" rx="14"/>
      <circle cx="26" cy="32" r="11" fill="#FFFFFF" opacity="0.85"/>
      <rect x="46" y="22" width="48" height="7" rx="3.5" fill="#FFFFFF" opacity="0.85"/>
      <rect x="46" y="36" width="32" height="7" rx="3.5" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </defs>

  <style>
    .name   { font: 800 96px "SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,sans-serif; fill:#4A3F6B; letter-spacing:-2px; }
    .hello  { font: 600 26px "SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif; fill:#9A8FB8; }
    .role   { font: 700 26px "SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif; fill:#6B5E91; }
    .focus  { font: 500 18px "SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif; fill:#9A8FB8; }
    .tag    { font: 700 13px "SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif; fill:#FFFFFF; }

    .intro  { opacity:0; animation: rise .9s cubic-bezier(.2,.8,.2,1) .2s forwards; }
    .intro2 { opacity:0; animation: rise .9s cubic-bezier(.2,.8,.2,1) .5s forwards; }
    .select { opacity:0; animation: pop .5s ease-out 1.1s forwards; }
    .drag   { animation: drag 6s cubic-bezier(.45,0,.2,1) 1.4s infinite; }
    .slot   { animation: slot 6s ease 1.4s infinite; }
    .tw     { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    .float  { animation: float 7s ease-in-out infinite; }

    @keyframes rise    { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
    @keyframes pop     { from { opacity:0; } to { opacity:1; } }
    @keyframes drag    {
      0%   { transform: translate(70px,96px); opacity:0; }
      8%   { transform: translate(70px,96px); opacity:1; }
      42%  { transform: translate(0,0);       opacity:1; }
      82%  { transform: translate(0,0);       opacity:1; }
      92%  { transform: translate(0,0);       opacity:0; }
      100% { transform: translate(70px,96px); opacity:0; }
    }
    @keyframes slot    { 0%,40% { opacity:1; } 46%,88% { opacity:0; } 94%,100% { opacity:1; } }
    @keyframes twinkle { 0%,100% { opacity:.25; transform: scale(.6); } 50% { opacity:1; transform: scale(1); } }
    @keyframes float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    @media (prefers-reduced-motion: reduce) {
      .intro,.intro2,.select { animation:none; opacity:1; }
      .drag,.slot,.tw,.float { animation:none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="1200" height="320" fill="#FCF8FF"/>
    <g filter="url(#soft)" opacity="0.75">
      <circle cx="120" cy="20"  r="150" fill="#F7C6D9"/>
      <circle cx="560" cy="330" r="130" fill="#FBE7A6"/>
      <circle cx="1120" cy="300" r="170" fill="#BDE8D6"/>
      <circle cx="900" cy="-10" r="140" fill="#C9B8F0"/>
    </g>

    <!-- Name block -->
    <text class="hello intro" x="84" y="104">Hi, I'm</text>
    <g class="intro">
      <text class="name" x="80" y="192">Bayan</text>
    </g>
    <!-- Figma-style selection around the name -->
    <g class="select">
      <rect x="72" y="114" width="302" height="100" fill="none" stroke="#9B87F5" stroke-width="2"/>
      <g fill="#FFFFFF" stroke="#9B87F5" stroke-width="2">
        <rect x="67"  y="109" width="10" height="10"/>
        <rect x="369" y="109" width="10" height="10"/>
        <rect x="67"  y="209" width="10" height="10"/>
        <rect x="369" y="209" width="10" height="10"/>
      </g>
    </g>
    <g class="intro2">
      <text class="role"  x="84" y="270">UI/UX &amp; Web Designer</text>
      <text class="focus" x="84" y="298">Design systems for government digital services</text>
    </g>

    <!-- Mini design canvas -->
    <g class="float">
      <rect x="700" y="46" width="430" height="228" rx="24" fill="#FFFFFF" fill-opacity="0.88" stroke="#EDE6FA" stroke-width="2" filter="url(#lift)"/>
      <circle cx="728" cy="72" r="6" fill="#F7C6D9"/>
      <circle cx="748" cy="72" r="6" fill="#FBE7A6"/>
      <circle cx="768" cy="72" r="6" fill="#BDE8D6"/>
      <rect x="980" y="66" width="122" height="12" rx="6" fill="#F3EEFC"/>

      <use href="#tileBody" x="728" y="98"  fill="#F7C6D9"/>
      <use href="#tileBody" x="858" y="98"  fill="#BDE8D6"/>
      <use href="#tileBody" x="988" y="98"  fill="#FBE7A6"/>
      <use href="#tileBody" x="728" y="182" fill="#BFDDF5"/>
      <use href="#tileBody" x="858" y="182" fill="#C9B8F0"/>

      <!-- Empty slot waiting for the dragged tile -->
      <rect class="slot" x="988" y="182" width="110" height="64" rx="14" fill="none" stroke="#C9B8F0" stroke-width="2" stroke-dasharray="7 6"/>

      <!-- Dragged tile + cursor -->
      <g class="drag">
        <use href="#tileBody" x="988" y="182" fill="#FFD3B8"/>
        <path d="M1078,222 l0,30 l8,-8 l6,13 l6,-3 l-6,-12 l11,0 Z" fill="#4A3F6B" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Sparkles -->
    <g fill="#C9B8F0">
      <use href="#spark" class="tw" x="430" y="70"/>
      <use href="#spark" class="tw" x="640" y="250" style="animation-delay:1.1s"/>
      <use href="#spark" class="tw" x="1160" y="40" style="animation-delay:2s" fill="#F7C6D9"/>
      <use href="#spark" class="tw" x="470" y="200" style="animation-delay:.6s" fill="#BDE8D6"/>
    </g>
  </g>
</svg>
