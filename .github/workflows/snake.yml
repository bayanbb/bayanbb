name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate pastel snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8E78F0&color_dots=#EDE6FA,#F7C6D9,#C9B8F0,#B5A4FF,#8E78F0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F7C6D9&color_dots=#2C2540,#4A3F6B,#6B5B9A,#8E78F0,#B5A4FF

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
